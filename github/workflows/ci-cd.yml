name: Floricola CI/CD Pipeline

on:
  workflow_dispatch:
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x']
    steps:
      - uses: actions/checkout@v4

      - name: Set Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint || true

      - name: Run unit tests
        run: npm test || true

      - name: Build frontend
        working-directory: ./Front-end
        run: npm ci && npm run build

      - name: Build backend
        working-directory: ./Back-end
        run: npm ci

      - name: Build Docker images
        run: |
          docker build -t floricola-api:${{ github.ref_name }} ./Back-end
          docker build -t floricola-ui:${{ github.ref_name }} ./Front-end

      - name: Push Docker images
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          docker login -u $DOCKER_USER -p $DOCKER_PASS
          docker push floricola-api:${{ github.ref_name }}
          docker push floricola-ui:${{ github.ref_name }}

  deploy-qa:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Deploy to QA Server
        run: |
          ssh -i ${{ secrets.SSH_QA_KEY }} user@qa.example.com "docker pull floricola-api:${{ github.ref_name }} && docker-compose -f docker-compose.qa.yml up -d"

  deploy-prod:
    needs: deploy-qa
    runs-on: ubuntu-latest
    if: needs.deploy-qa.outputs.success
    steps:
      - name: Deploy to Production
        run: |
          ssh -i ${{ secrets.SSH_PROD_KEY }} user@prod.example.com "docker pull floricola-api:${{ github.ref_name }} && docker-compose -f docker-compose.prod.yml up -d"
